<ion-header>
  <ion-toolbar>
    <ion-title>Iniciar sesión</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismissModal()">
        <ion-icon name="close"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <form id="authForms" (ngSubmit)="onSubmit()">
    <ion-item>
      <ion-label position="floating">Correo</ion-label>
      <ion-input id="emailInput" type="email" [(ngModel)]="email" name="email" required></ion-input>
    </ion-item>

    <ion-item>
      <ion-label position="floating">Contraseña</ion-label>
      <ion-input 
        id="passwordInput"
        [type]="passwordType" 
        [(ngModel)]="password" 
        name="password" 
        required>
      </ion-input>
      <ion-button fill="clear" slot="end" (click)="passwordVisibility()">
        <ion-icon [name]="passwordIcon"></ion-icon>
      </ion-button>
    </ion-item>

    <div class="ion-padding">
      <ion-button
      expand="block"
      type="submit"
      routerLink="/home"
      routerDirection="root">Iniciar sesión</ion-button>
    </div>
  </form>
</ion-content>
