<ion-menu contentId="cars-content" type="overlay">
  <ion-header>
    <ion-toolbar>
    </ion-toolbar>
  </ion-header>
  <ion-content>
    <ion-list>
      <ion-item routerLink="/home" routerDirection="root">
        <ion-icon name="home" slot="start"></ion-icon>
        <ion-label>Inicio</ion-label>
      </ion-item>
      <ion-item routerLink="/carros" routerDirection="root">
        <ion-icon name="car-sport" slot="start"></ion-icon>
        <ion-label>Carros</ion-label>
      </ion-item>
      <ion-item routerLink="/reparaciones" routerDirection="root">
        <ion-icon name="cog" slot="start"></ion-icon>
        <ion-label>Reparaciones</ion-label>
      </ion-item>
      <ion-item routerLink="/about" routerDirection="root">
        <ion-icon name="information-circle" slot="start"></ion-icon>
        <ion-label>Actualizaciones</ion-label>
      </ion-item>
    </ion-list>
  </ion-content>
</ion-menu>


<ion-header [translucent]="true">
  <ion-toolbar color="transparent">
    <ion-buttons slot="start">
      <ion-menu-button></ion-menu-button>
    </ion-buttons>
    <div class="toolbar">
      <ion-title style="text-align: center;">Carros</ion-title>
      <app-auth-btn></app-auth-btn>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content id="cars-content" [fullscreen]="true">
</ion-content>
