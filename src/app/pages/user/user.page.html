<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button></ion-back-button>
    </ion-buttons>
    <div class="toolbar">
      <ion-title>Perfil</ion-title>
    </div>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" *ngIf="user">
  <div class="main-data">
    <ion-avatar>
      <img [src]="user.fotoPerfil" />
    </ion-avatar>
    <div>
      <h1>{{ user.nombre }}</h1>
      <h3>{{ user.correo }}</h3>
    </div>
  </div>
  
  <div>
  </div>
  
</ion-content>
